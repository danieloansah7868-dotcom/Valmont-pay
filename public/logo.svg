<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Dark navy background -->
  <rect width="400" height="100" fill="#0b1a38"/>
  <!-- Hexagon icon -->
  <g transform="translate(8, 8)">
    <!-- Outer orange hexagon -->
    <polygon points="42,4 76,23 76,61 42,80 8,61 8,23"
             fill="none" stroke="url(#orangeGrad)" stroke-width="8" stroke-linejoin="round"/>
    <!-- Inner white hexagon -->
    <polygon points="42,12 68,27 68,57 42,72 16,57 16,27"
             fill="#ffffff" stroke="#0b1a38" stroke-width="2" stroke-linejoin="round"/>
    <!-- Wallet (simplified) -->
    <rect x="26" y="34" width="32" height="26" rx="3" fill="#0b1a38" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Wallet clasp -->
    <rect x="46" y="42" width="12" height="10" rx="2" fill="#0b1a38" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="52" cy="47" r="2.5" fill="#ffffff"/>
    <!-- Dollar circle -->
    <circle cx="58" cy="34" r="11" fill="#ffffff" stroke="#0b1a38" stroke-width="1.5"/>
    <path d="M 58,25 A 9,9 0 1,1 49,34" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <polygon points="49,30 49,38 44,34" fill="#f97316"/>
    <text x="58" y="42" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#f97316" text-anchor="middle">$</text>
  </g>
  <!-- VALMONT text -->
  <text x="100" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="1">VALMONT</text>
  <!-- PAY text -->
  <text x="268" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#f97316" letter-spacing="1">PAY</text>
</svg>
