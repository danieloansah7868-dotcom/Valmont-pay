<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valmont Messenger</title>
  <link rel="icon" href="/favicon.svg" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ── Reset & Variables ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --bg-card: #1e1e3a;
      --bg-input: #252547;
      --bg-hover: #2a2a5a;
      --accent: #6c63ff;
      --accent-light: #8b83ff;
      --accent-dark: #5a52d9;
      --success: #00c853;
      --warning: #ff9100;
      --danger: #ff1744;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0b8;
      --text-muted: #666680;
      --border: #2a2a4a;
      --shadow: rgba(0,0,0,0.4);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s ease;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); }

    /* ── Login Screen ─────────────────────────────────────────────── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 48px 40px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 20px 60px var(--shadow);
    }
    .login-card .logo { font-size: 48px; margin-bottom: 8px; }
    .login-card h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .login-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
    .login-card input {
      width: 100%; padding: 14px 18px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary); font-size: 16px;
      outline: none; transition: border var(--transition); margin-bottom: 16px;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card button {
      width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background var(--transition);
    }
    .login-card button:hover { background: var(--accent-light); }
    .login-card .error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
    .avatar-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    .avatar-option {
      width: 52px; height: 52px; border-radius: 50%; background: var(--bg-input); border: 2px solid transparent;
      font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all var(--transition);
    }
    .avatar-option:hover, .avatar-option.selected { border-color: var(--accent); background: var(--bg-hover); transform: scale(1.1); }

    /* ── App Layout ────────────────────────────────────────────────── */
    #app { display: none; height: 100vh; }
    .app-container { display: flex; height: 100%; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 320px; min-width: 320px; background: var(--bg-secondary); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100%;
    }
    .sidebar-header {
      padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
    }
    .sidebar-header h2 { font-size: 18px; font-weight: 700; flex: 1; }
    .sidebar-header .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%; background: var(--bg-input); border: none;
      color: var(--text-secondary); font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--accent); color: #fff; }

    /* Tabs */
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .sidebar-tab {
      flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all var(--transition);
    }
    .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .sidebar-tab:hover { color: var(--text-primary); }

    /* Search */
    .search-box {
      padding: 12px 16px;
    }
    .search-box input {
      width: 100%; padding: 10px 14px 10px 36px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-primary); font-size: 14px; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box { position: relative; }
    .search-box::before { content: '🔍'; position: absolute; left: 28px; top: 50%; transform: translateY(-50%); font-size: 14px; }

    /* Room/User List */
    .list-container { flex: 1; overflow-y: auto; padding: 8px; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .list-item {
      display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--radius);
      cursor: pointer; transition: background var(--transition); position: relative;
    }
    .list-item:hover { background: var(--bg-hover); }
    .list-item.active { background: var(--accent-dark); }
    .list-item .avatar {
      width: 44px; height: 44px; border-radius: 50%; background: var(--bg-input);
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      flex-shrink: 0; position: relative;
    }
    .list-item .status-dot {
      width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-secondary);
      position: absolute; bottom: 0; right: 0;
    }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--text-muted); }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .info .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .info .preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .list-item .unread-badge {
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center;
    }

    /* ── Chat Area ──────────────────────────────────────────────────── */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }

    /* Chat Header */
    .chat-header {
      padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 12px; background: var(--bg-secondary);
    }
    .chat-header .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .chat-header .info .name { font-size: 16px; font-weight: 600; }
    .chat-header .info .status { font-size: 12px; color: var(--text-secondary); }
    .chat-header .actions { margin-left: auto; display: flex; gap: 8px; }

    /* Messages */
    .messages-container {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px;
    }
    .messages-container::-webkit-scrollbar { width: 6px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message-group { display: flex; gap: 8px; max-width: 70%; margin-bottom: 4px; }
    .message-group.own { align-self: flex-end; flex-direction: row-reverse; }
    .message-group .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; background: var(--bg-input);
      display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
      align-self: flex-end;
    }
    .message-bubble {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px;
      padding: 10px 14px; position: relative;
    }
    .message-group.own .message-bubble {
      background: var(--accent-dark); border-color: var(--accent); border-radius: 16px 16px 4px 16px;
    }
    .message-bubble .sender { font-size: 12px; font-weight: 600; color: var(--accent-light); margin-bottom: 2px; }
    .message-group.own .message-bubble .sender { color: rgba(255,255,255,0.7); }
    .message-bubble .text { font-size: 14px; line-height: 1.5; word-break: break-word; }
    .message-bubble .file-attachment {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: rgba(0,0,0,0.2); border-radius: var(--radius-sm); margin-top: 6px;
      text-decoration: none; color: var(--text-primary);
    }
    .message-bubble .file-attachment:hover { background: rgba(0,0,0,0.3); }
    .message-bubble .file-attachment .file-icon { font-size: 24px; }
    .message-bubble .file-attachment .file-info .file-name { font-size: 13px; font-weight: 500; }
    .message-bubble .file-attachment .file-info .file-size { font-size: 11px; color: var(--text-secondary); }
    .message-bubble img.preview-img {
      max-width: 280px; max-height: 200px; border-radius: var(--radius-sm); margin-top: 6px; cursor: pointer;
    }
    .message-bubble .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; justify-content: flex-end; }
    .message-bubble .meta .time { font-size: 11px; color: var(--text-muted); }
    .message-group.own .message-bubble .meta .time { color: rgba(255,255,255,0.5); }
    .message-bubble .meta .read-receipt { font-size: 12px; }
    .read-receipt.sent { color: var(--text-muted); }
    .read-receipt.delivered { color: var(--text-secondary); }
    .read-receipt.read { color: var(--accent-light); }

    /* System message */
    .system-message {
      text-align: center; font-size: 12px; color: var(--text-muted); padding: 8px;
      align-self: center; background: rgba(255,255,255,0.03); border-radius: 20px; padding: 4px 16px;
    }

    /* Typing indicator */
    .typing-indicator {
      font-size: 13px; color: var(--text-secondary); padding: 8px 24px;
      min-height: 32px; display: flex; align-items: center; gap: 8px;
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
      width: 6px; height: 6px; background: var(--text-secondary); border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input Area */
    .chat-input-area {
      padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg-secondary);
      display: flex; align-items: flex-end; gap: 12px;
    }
    .input-actions { display: flex; gap: 4px; }
    .chat-input-wrapper { flex: 1; position: relative; }
    .chat-input {
      width: 100%; padding: 12px 16px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-primary); font-size: 14px; outline: none;
      resize: none; max-height: 120px; min-height: 44px; line-height: 1.4; font-family: inherit;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none;
      color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all var(--transition); flex-shrink: 0;
    }
    .send-btn:hover { background: var(--accent-light); transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    /* File preview */
    .file-preview {
      display: none; padding: 8px 24px; background: var(--bg-secondary); border-top: 1px solid var(--border);
      align-items: center; gap: 12px;
    }
    .file-preview.active { display: flex; }
    .file-preview .file-thumb { width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-input); display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .file-preview .file-details { flex: 1; }
    .file-preview .file-details .file-name { font-size: 13px; font-weight: 500; }
    .file-preview .file-details .file-size { font-size: 11px; color: var(--text-secondary); }
    .file-preview .remove-file { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }

    /* ── Empty State ────────────────────────────────────────────────── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); gap: 12px;
    }
    .empty-state .icon { font-size: 64px; opacity: 0.5; }
    .empty-state h3 { font-size: 20px; color: var(--text-secondary); }
    .empty-state p { font-size: 14px; }

    /* ── Modals ─────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 32px; width: 100%; max-width: 440px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px var(--shadow);
    }
    .modal h3 { font-size: 18px; margin-bottom: 16px; }
    .modal input, .modal select {
      width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 12px;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal .checkbox-list { max-height: 200px; overflow-y: auto; margin-bottom: 16px; }
    .modal .checkbox-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background var(--transition);
    }
    .modal .checkbox-item:hover { background: var(--bg-hover); }
    .modal .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
    .modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
    .btn {
      padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all var(--transition);
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-light); }
    .btn-secondary { background: var(--bg-input); color: var(--text-primary); }
    .btn-secondary:hover { background: var(--bg-hover); }

    /* ── Image Lightbox ─────────────────────────────────────────────── */
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90%; border-radius: var(--radius); }

    /* ── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; position: absolute; z-index: 10; transform: translateX(0); transition: transform 0.3s ease; }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-header .back-btn { display: flex !important; }
    }
    .back-btn { display: none; }

    /* ── Notification sound visual ──────────────────────────────────── */
    .notification-pulse {
      animation: pulse 0.3s ease;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN SCREEN ═══════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">💬</div>
    <h1>Valmont Messenger</h1>
    <p>Connect and chat in real time</p>
    <div class="avatar-grid" id="avatar-grid"></div>
    <input type="text" id="username-input" placeholder="Enter your username..." maxlength="20" autocomplete="off" />
    <button id="join-btn" onclick="doJoin()">Join Chat</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════════ MAIN APP ═══════════════ -->
<div id="app">
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>💬 Messenger</h2>
        <div class="header-actions">
          <button class="icon-btn" id="new-group-btn" title="New Group" onclick="showModal('group-modal')">👥</button>
          <button class="icon-btn" id="new-dm-btn" title="New DM" onclick="showModal('dm-modal')">✏️</button>
        </div>
      </div>
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="chats" onclick="switchTab('chats')">Chats</div>
        <div class="sidebar-tab" data-tab="people" onclick="switchTab('people')">People</div>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search..." oninput="filterList()" />
      </div>
      <div class="list-container" id="sidebar-list"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="icon">💬</div>
        <h3>Welcome to Valmont Messenger</h3>
        <p>Select a chat or start a new conversation</p>
      </div>

      <!-- Active Chat UI (hidden by default) -->
      <div id="active-chat" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header">
          <button class="icon-btn back-btn" onclick="showSidebar()">←</button>
          <div class="avatar" id="chat-avatar">💬</div>
          <div class="info">
            <div class="name" id="chat-name">Chat</div>
            <div class="status" id="chat-status"></div>
          </div>
          <div class="actions">
            <button class="icon-btn" title="Room members" onclick="showRoomInfo()">ℹ️</button>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="typing-indicator" id="typing-indicator">
          <div class="typing-dots" style="display:none"><span></span><span></span><span></span></div>
          <span id="typing-text"></span>
        </div>

        <div class="file-preview" id="file-preview">
          <div class="file-thumb" id="file-thumb">📎</div>
          <div class="file-details">
            <div class="file-name" id="preview-filename"></div>
            <div class="file-size" id="preview-filesize"></div>
          </div>
          <button class="remove-file" onclick="removeFile()">✕</button>
        </div>

        <div class="chat-input-area">
          <div class="input-actions">
            <button class="icon-btn" title="Attach file" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="file" id="file-input" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt,.zip,.mp3,.mp4" onchange="handleFileSelect(event)" />
          </div>
          <div class="chat-input-wrapper">
            <textarea class="chat-input" id="message-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)" oninput="handleInput()"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════ MODALS ═══════════════ -->

<!-- New Group Modal -->
<div class="modal-overlay" id="group-modal">
  <div class="modal">
    <h3>👥 Create Group</h3>
    <input type="text" id="group-name-input" placeholder="Group name..." maxlength="30" />
    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:8px;">Select members:</p>
    <div class="checkbox-list" id="group-members-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="hideModal('group-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createGroup()">Create</button>
    </div>
  </div>
</div>

<!-- New DM Modal -->
<div class="modal-overlay" id="dm-modal">
  <div class="modal">
    <h3>✏️ New Message</h3>
    <p style="font-size:13px; color:var(--text-secondary); margin-bottom:8px;">Select a person:</p>
    <div class="checkbox-list" id="dm-users-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="hideModal('dm-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let socket = null;
let currentUser = null;
let selectedAvatar = '😀';
let currentRoomId = null;
let rooms = [];
let onlineUsers = [];
let allUsers = [];
let typingTimers = {};
let pendingFile = null;
let activeTab = 'chats';

const AVATARS = ['😀','😎','🧑‍💻','👩‍🎤','🦸','🦊','🐱','🐻','🌟','🔥','💎','🚀'];

// ── Init ──────────────────────────────────────────────────────────────
function init() {
  const grid = document.getElementById('avatar-grid');
  AVATARS.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'avatar-option' + (i === 0 ? ' selected' : '');
    el.textContent = a;
    el.onclick = () => {
      document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = a;
    };
    grid.appendChild(el);
  });

  document.getElementById('username-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doJoin();
  });
}

function doJoin() {
  const username = document.getElementById('username-input').value.trim();
  const errorEl = document.getElementById('login-error');
  if (!username) {
    errorEl.textContent = 'Please enter a username';
    errorEl.style.display = 'block';
    return;
  }
  if (username.length < 2) {
    errorEl.textContent = 'Username must be at least 2 characters';
    errorEl.style.display = 'block';
    return;
  }
  errorEl.style.display = 'none';
  connectSocket(username);
}

// ── Socket Connection ──────────────────────────────────────────────────
function connectSocket(username) {
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => {
    socket.emit('user:join', { username, avatar: selectedAvatar });
  });

  socket.on('user:joined', (data) => {
    currentUser = data.user;
    rooms = data.rooms;
    onlineUsers = data.onlineUsers;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchAllUsers();
    renderSidebar();
    // Auto-select General room
    selectRoom('general');
  });

  socket.on('error', (data) => {
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = data.message;
    errorEl.style.display = 'block';
  });

  socket.on('message:new', (msg) => {
    if (msg.roomId === currentRoomId) {
      appendMessage(msg);
      scrollToBottom();
      socket.emit('messages:read', { roomId: currentRoomId });
    }
    updateRoomPreview(msg);
  });

  socket.on('room:notification', (data) => {
    if (data.roomId === currentRoomId) {
      appendSystemMessage(data.message);
      scrollToBottom();
    }
  });

  socket.on('typing:start', ({ roomId, username: typer }) => {
    if (roomId === currentRoomId) {
      showTyping(typer);
    }
  });

  socket.on('typing:stop', ({ roomId }) => {
    if (roomId === currentRoomId) {
      hideTyping();
    }
  });

  socket.on('messages:read', ({ roomId, userId }) => {
    // Update read receipts visually
    document.querySelectorAll('.read-receipt.sent, .read-receipt.delivered').forEach(el => {
      el.className = 'read-receipt read';
      el.textContent = '✓✓';
    });
  });

  socket.on('users:online', (users) => {
    onlineUsers = users;
    renderSidebar();
  });

  socket.on('room:created', (room) => {
    const exists = rooms.find(r => r.id === room.id);
    if (!exists) {
      rooms.push(room);
      socket.emit('room:join', { roomId: room.id });
      renderSidebar();
    }
  });

  socket.on('room:joined', ({ roomId, messages }) => {
    if (roomId === currentRoomId) {
      renderMessages(messages);
    }
  });
}

// ── Fetch helpers ──────────────────────────────────────────────────────
async function fetchAllUsers() {
  try {
    const res = await fetch('/api/messenger/users');
    allUsers = await res.json();
  } catch (e) { /* ignore */ }
}

// ── Room Selection ─────────────────────────────────────────────────────
async function selectRoom(roomId) {
  currentRoomId = roomId;
  const room = rooms.find(r => r.id === roomId);
  if (!room) return;

  // Update UI
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('active-chat').style.display = 'flex';
  document.getElementById('chat-name').textContent = room.name;
  document.getElementById('chat-avatar').textContent = room.type === 'dm' ? '💬' : '👥';
  document.getElementById('chat-status').textContent = room.type === 'group'
    ? `${room.members?.length || 0} members`
    : (isOnline(getOtherDmUser(room)) ? 'Online' : 'Offline');

  // Mark active
  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.list-item[data-id="${roomId}"]`)?.classList.add('active');

  // Join & fetch messages
  socket.emit('room:join', { roomId });
  socket.emit('messages:read', { roomId });
  hideTyping();

  // On mobile, hide sidebar
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.add('hidden');
  }
}

function getOtherDmUser(room) {
  if (room.type !== 'dm' || !currentUser) return null;
  return room.members?.find(m => m !== currentUser.id);
}

function isOnline(userId) {
  return onlineUsers.some(u => u.id === userId);
}

function showSidebar() {
  document.getElementById('sidebar').classList.remove('hidden');
}

// ── Render Sidebar ─────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const search = document.getElementById('search-input').value.toLowerCase();

  if (activeTab === 'chats') {
    const filtered = rooms.filter(r => r.name.toLowerCase().includes(search));
    list.innerHTML = filtered.map(room => {
      const isActive = room.id === currentRoomId;
      const emoji = room.type === 'dm' ? '💬' : '👥';
      return `
        <div class="list-item ${isActive ? 'active' : ''}" data-id="${room.id}" onclick="selectRoom('${room.id}')">
          <div class="avatar">${emoji}</div>
          <div class="info">
            <div class="name">${escHtml(room.name)}</div>
            <div class="preview" id="preview-${room.id}"></div>
          </div>
        </div>`;
    }).join('');
  } else {
    const filtered = allUsers.filter(u =>
      u.id !== currentUser?.id && u.username.toLowerCase().includes(search)
    );
    list.innerHTML = filtered.map(u => {
      const online = isOnline(u.id);
      return `
        <div class="list-item" data-id="${u.id}" onclick="startDM('${u.id}')">
          <div class="avatar">
            ${u.avatar || '😀'}
            <div class="status-dot ${online ? 'online' : 'offline'}"></div>
          </div>
          <div class="info">
            <div class="name">${escHtml(u.username)}</div>
            <div class="preview">${online ? 'Online' : 'Offline'}</div>
          </div>
        </div>`;
    }).join('');
  }
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.sidebar-tab[data-tab="${tab}"]`).classList.add('active');
  renderSidebar();
}

function filterList() { renderSidebar(); }

// ── Render Messages ────────────────────────────────────────────────────
async function renderMessages(messages) {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';
  messages.forEach(msg => appendMessage(msg));
  scrollToBottom();
}

function appendMessage(msg) {
  const container = document.getElementById('messages-container');
  const isOwn = msg.senderId === currentUser?.id;
  const sender = msg.sender || { username: 'Unknown', avatar: '😀' };

  let content = '';
  if (msg.text) {
    content += `<div class="text">${escHtml(msg.text)}</div>`;
  }
  if (msg.file) {
    if (msg.file.mimeType?.startsWith('image/')) {
      content += `<img class="preview-img" src="${msg.file.url}" alt="${escHtml(msg.file.name)}" onclick="openLightbox('${msg.file.url}')" />`;
    }
    content += `
      <a class="file-attachment" href="${msg.file.url}" target="_blank" rel="noopener">
        <span class="file-icon">📎</span>
        <div class="file-info">
          <div class="file-name">${escHtml(msg.file.name)}</div>
          <div class="file-size">${formatSize(msg.file.size)}</div>
        </div>
      </a>`;
  }

  const readClass = isOwn ? (msg.readBy?.length > 1 ? 'read' : 'sent') : '';
  const readIcon = isOwn ? `<span class="read-receipt ${readClass}">${readClass === 'read' ? '✓✓' : '✓'}</span>` : '';

  const div = document.createElement('div');
  div.className = `message-group ${isOwn ? 'own' : ''}`;
  div.innerHTML = `
    <div class="msg-avatar">${isOwn ? '' : (sender.avatar || '😀')}</div>
    <div class="message-bubble">
      ${!isOwn ? `<div class="sender">${escHtml(sender.username)}</div>` : ''}
      ${content}
      <div class="meta">
        <span class="time">${formatTime(msg.timestamp)}</span>
        ${readIcon}
      </div>
    </div>`;
  container.appendChild(div);
}

function appendSystemMessage(text) {
  const container = document.getElementById('messages-container');
  const div = document.createElement('div');
  div.className = 'system-message';
  div.textContent = text;
  container.appendChild(div);
}

function scrollToBottom() {
  const container = document.getElementById('messages-container');
  requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
}

// ── Send Message ───────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const payload = { roomId: currentRoomId, text, file: null, type: 'text' };

  if (pendingFile) {
    payload.file = pendingFile;
    payload.type = pendingFile.mimeType?.startsWith('image/') ? 'image' : 'file';
    if (text) payload.type = 'text'; // text with attachment
  }

  socket.emit('message:send', payload);

  input.value = '';
  input.style.height = 'auto';
  removeFile();
  document.getElementById('send-btn').disabled = true;
}

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function handleInput() {
  const input = document.getElementById('message-input');
  const btn = document.getElementById('send-btn');
  btn.disabled = !input.value.trim() && !pendingFile;

  // Auto-resize
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';

  // Typing indicator
  if (currentRoomId) {
    socket.emit('typing:start', { roomId: currentRoomId });
    clearTimeout(typingTimers[currentRoomId]);
    typingTimers[currentRoomId] = setTimeout(() => {
      socket.emit('typing:stop', { roomId: currentRoomId });
    }, 2000);
  }
}

// ── File Handling ──────────────────────────────────────────────────────
async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch('/api/messenger/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    pendingFile = data;
    document.getElementById('preview-filename').textContent = data.name;
    document.getElementById('preview-filesize').textContent = formatSize(data.size);

    const thumb = document.getElementById('file-thumb');
    if (data.mimeType?.startsWith('image/')) {
      thumb.innerHTML = `<img src="${data.url}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;" />`;
    } else {
      thumb.innerHTML = '📄';
    }

    document.getElementById('file-preview').classList.add('active');
    document.getElementById('send-btn').disabled = false;
  } catch (err) {
    alert('Upload failed: ' + err.message);
  }

  event.target.value = '';
}

function removeFile() {
  pendingFile = null;
  document.getElementById('file-preview').classList.remove('active');
  const input = document.getElementById('message-input');
  document.getElementById('send-btn').disabled = !input.value.trim();
}

// ── Typing Indicator ──────────────────────────────────────────────────
function showTyping(username) {
  document.querySelector('.typing-dots').style.display = 'flex';
  document.getElementById('typing-text').textContent = `${username} is typing...`;
}

function hideTyping() {
  document.querySelector('.typing-dots').style.display = 'none';
  document.getElementById('typing-text').textContent = '';
}

// ── Modals ─────────────────────────────────────────────────────────────
function showModal(id) {
  document.getElementById(id).classList.add('active');
  if (id === 'group-modal') renderMemberCheckboxes();
  if (id === 'dm-modal') renderDmUserList();
}

function hideModal(id) {
  document.getElementById(id).classList.remove('active');
}

function renderMemberCheckboxes() {
  const list = document.getElementById('group-members-list');
  const others = allUsers.filter(u => u.id !== currentUser?.id);
  list.innerHTML = others.map(u => `
    <label class="checkbox-item">
      <input type="checkbox" value="${u.id}" />
      <span>${u.avatar || '😀'} ${escHtml(u.username)}</span>
    </label>
  `).join('') || '<p style="color:var(--text-muted);padding:12px;">No other users yet</p>';
}

function renderDmUserList() {
  const list = document.getElementById('dm-users-list');
  const others = allUsers.filter(u => u.id !== currentUser?.id);
  list.innerHTML = others.map(u => `
    <div class="checkbox-item" onclick="startDM('${u.id}'); hideModal('dm-modal');">
      <span>${u.avatar || '😀'} ${escHtml(u.username)}</span>
      <span style="color:var(--text-muted);font-size:12px;">${isOnline(u.id) ? '🟢 Online' : '⚪ Offline'}</span>
    </div>
  `).join('') || '<p style="color:var(--text-muted);padding:12px;">No other users yet</p>';
}

function createGroup() {
  const name = document.getElementById('group-name-input').value.trim();
  if (!name) return alert('Please enter a group name');

  const members = [];
  document.querySelectorAll('#group-members-list input:checked').forEach(cb => {
    members.push(cb.value);
  });

  socket.emit('room:create', { name, members });
  hideModal('group-modal');
  document.getElementById('group-name-input').value = '';
}

function startDM(userId) {
  socket.emit('dm:start', { targetUserId: userId });
  hideModal('dm-modal');
}

function showRoomInfo() {
  const room = rooms.find(r => r.id === currentRoomId);
  if (!room) return;
  const members = (room.members || []).map(id => {
    const u = allUsers.find(u => u.id === id) || { username: 'Unknown', avatar: '😀' };
    return `${u.avatar || '😀'} ${u.username}`;
  }).join('\n');
  alert(`Room: ${room.name}\nType: ${room.type}\n\nMembers:\n${members}`);
}

// ── Lightbox ──────────────────────────────────────────────────────────
function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

// ── Utilities ──────────────────────────────────────────────────────────
function escHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000 && d.getDate() === now.getDate()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function updateRoomPreview(msg) {
  const preview = document.getElementById(`preview-${msg.roomId}`);
  if (preview) {
    const sender = msg.sender?.username || 'Someone';
    preview.textContent = msg.file ? `${sender}: 📎 Attachment` : `${sender}: ${msg.text || ''}`;
  }
}

// ── Click outside modal to close ──────────────────────────────────────
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
});

// ── Init ──────────────────────────────────────────────────────────────
init();
</script>
