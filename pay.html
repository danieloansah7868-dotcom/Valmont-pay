<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valmont-Pay — Quick Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b1a38; }
    .valmont-gold { background-color: #f68b1e; }
    .valmont-gold-text { color: #f68b1e; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Payment Card Container -->
  <div class="bg-white w-full max-w-[480px] rounded-xl shadow-2xl overflow-hidden border border-gray-100">
    
    <!-- Header -->
    <div class="bg-[#0b1a38] text-white p-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-3 w-3 rounded-full bg-[#f68b1e] animate-pulse"></div>
        <span class="font-extrabold text-sm uppercase tracking-widest text-[#f68b1e]">Valmont-Pay</span>
      </div>
      <span class="text-xs text-gray-400 font-bold">Quick Payment</span>
    </div>

    <!-- Payment Form -->
    <div class="p-8 space-y-6">
      
      <!-- Amount Display -->
      <div class="bg-gray-50 p-6 rounded-lg border border-gray-100 text-center">
        <span class="block text-xs text-gray-400 font-bold uppercase tracking-wider">Amount to Pay</span>
        <span class="block text-4xl font-black text-[#0b1a38] mt-2" id="displayAmount">GH₵ 0.00</span>
        <span class="block text-sm text-gray-500 font-medium mt-2" id="merchant-display">Valmont-Pay</span>
      </div>

      <!-- Email Input -->
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-2">Your Email Address *</label>
        <input id="customerEmail" type="email" placeholder="your@email.com" 
               class="w-full border-2 border-gray-100 p-4 rounded-lg text-sm outline-none font-semibold focus:border-[#f68b1e] transition" />
      </div>

      <!-- Quick Amount Buttons -->
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-2">Quick Select Amount</label>
        <div class="grid grid-cols-3 gap-3">
          <button onclick="setAmount(50)" class="border-2 border-gray-100 hover:border-[#f68b1e] p-3 rounded-lg text-sm font-bold text-gray-600 hover:text-[#f68b1e] transition">GH₵ 50</button>
          <button onclick="setAmount(100)" class="border-2 border-gray-100 hover:border-[#f68b1e] p-3 rounded-lg text-sm font-bold text-gray-600 hover:text-[#f68b1e] transition">GH₵ 100</button>
          <button onclick="setAmount(200)" class="border-2 border-gray-100 hover:border-[#f68b1e] p-3 rounded-lg text-sm font-bold text-gray-600 hover:text-[#f68b1e] transition">GH₵ 200</button>
        </div>
      </div>

      <!-- Custom Amount -->
      <div>
        <label class="block text-xs font-black uppercase text-gray-400 mb-2">Or Enter Custom Amount (GHS)</label>
        <input id="customAmount" type="number" placeholder="Enter amount" min="1" step="0.01"
               class="w-full border-2 border-gray-100 p-4 rounded-lg text-sm outline-none font-semibold focus:border-[#f68b1e] transition" />
      </div>

      <!-- Pay Button -->
      <button id="btnProceed" onclick="proceedToCheckout()" 
              class="w-full bg-[#f68b1e] hover:bg-orange-600 text-white font-black text-sm tracking-widest uppercase py-4 rounded-lg transition shadow-lg">
        Proceed to Checkout
      </button>

      <!-- Footer -->
      <div class="text-center pt-4 border-t border-gray-100">
        <p class="text-xs text-gray-400 font-medium">Secured by Valmont-Pay Payment Gateway</p>
      </div>

    </div>

  </div>

  <script>
    // Read merchant + amount from the URL (e.g. pay.html?amount=50&merchant=Valmont+Electricals)
    const urlParams = new URLSearchParams(window.location.search);
    const merchantName = urlParams.get('merchant') || 'Valmont-Pay';

    // Show the dynamic merchant name and update the page title (Issue 1 fix)
    document.getElementById('merchant-display').textContent = merchantName;
    document.title = 'Pay ' + merchantName + ' — Valmont-Pay';

    let currentAmount = 0;

    function setAmount(amount) {
      currentAmount = amount;
      document.getElementById('displayAmount').textContent = `GH₵ ${amount.toLocaleString()}`;
      document.getElementById('customAmount').value = amount;
      updateButtonText();
    }

    function updateButtonText() {
      const btn = document.getElementById('btnProceed');
      if (currentAmount > 0) {
        btn.textContent = `Pay GH₵ ${currentAmount.toLocaleString()}`;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        btn.textContent = 'Proceed to Checkout';
        btn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }

    document.getElementById('customAmount').addEventListener('input', function() {
      const val = parseFloat(this.value);
      if (!isNaN(val) && val > 0) {
        setAmount(val);
      } else {
        // Reset when input is cleared / invalid so the button state stays in sync
        currentAmount = 0;
        document.getElementById('displayAmount').textContent = 'GH₵ 0.00';
        updateButtonText();
      }
    });

    function proceedToCheckout() {
      const email = document.getElementById('customerEmail').value.trim();
      
      if (!email) {
        alert('Please enter your email address.');
        return;
      }

      if (!email.includes('@')) {
        alert('Please enter a valid email address.');
        return;
      }

      if (currentAmount <= 0) {
        alert('Please select or enter an amount.');
        return;
      }

      // Initialize transaction via API
      fetch('/api/v1/transaction/initialize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          amount: currentAmount,
          merchant: merchantName,
          callback_url: 'https://valmont-pay.vercel.app/checkout.html'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status && data.data.checkout_url) {
          // Redirect to checkout page using the URL returned by the API,
          // making sure the merchant name + amount + email are carried through.
          const checkoutUrl = new URL(data.data.checkout_url);
          checkoutUrl.searchParams.set('amount', currentAmount);
          checkoutUrl.searchParams.set('email', email);
          checkoutUrl.searchParams.set('merchant', merchantName);
          if (data.data.callback_url) {
            checkoutUrl.searchParams.set('callback_url', data.data.callback_url);
          }
          window.location.href = checkoutUrl.toString();
        } else {
          alert('Failed to initialize transaction. Please try again.');
        }
      })
      .catch(err => {
        console.error('Error:', err);
        alert('Connection error. Please check your network.');
      });
    }

    // Initialize (prefill amount from the URL when provided, e.g. ?amount=50)
    const urlAmount = parseFloat(urlParams.get('amount'));
    if (!isNaN(urlAmount) && urlAmount > 0) {
      setAmount(urlAmount);
    } else {
      updateButtonText();
    }
  </script>

</body>
</html>
