<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VChat</title>
  <link rel="icon" href="/favicon.svg" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-deep: #050d24;
      --bg-primary: #0b1a38;
      --bg-secondary: #0f1f45;
      --bg-card: #142850;
      --bg-input: #0a1630;
      --bg-hover: #1a3460;
      --accent: #f68b1e;
      --accent-hover: #e07a10;
      --accent-glow: rgba(246, 139, 30, 0.15);
      --success: #22c55e;
      --danger: #ef4444;
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --text-muted: #4a5e80;
      --border: #142850;
      --border-light: #1e3a6a;
      --shadow: rgba(0,0,0,0.5);
      --radius: 8px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg-deep); color: var(--text-primary); }

    /* ── Login Screen ─────────────────────────────────────────────── */
    #login-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; background: var(--bg-deep);
    }
    .login-card {
      background: var(--bg-primary); border: 1px solid var(--border); border-radius: 12px;
      padding: 48px 40px; width: 100%; max-width: 420px; text-align: center;
      box-shadow: 0 20px 60px var(--shadow);
    }
    .login-card .logo { font-size: 48px; margin-bottom: 8px; }
    .login-card h1 { font-size: 28px; font-weight: 900; letter-spacing: 1px; color: var(--accent); margin-bottom: 4px; text-transform: uppercase; }
    .login-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }
    .login-card input {
      width: 100%; padding: 14px 18px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary); font-size: 15px;
      outline: none; transition: border var(--transition); margin-bottom: 16px;
    }
    .login-card input:focus { border-color: var(--accent); }
    .login-card input::placeholder { color: var(--text-muted); }
    .login-card button {
      width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 15px; font-weight: 800; cursor: pointer; transition: background var(--transition);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .login-card button:hover { background: var(--accent-hover); }
    .login-card .error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }
    .avatar-grid { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    .avatar-option {
      width: 48px; height: 48px; border-radius: 50%; background: var(--bg-card); border: 2px solid transparent;
      font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all var(--transition);
    }
    .avatar-option:hover, .avatar-option.selected { border-color: var(--accent); background: var(--bg-hover); transform: scale(1.1); }

    /* ── App Layout ────────────────────────────────────────────────── */
    #app { display: none; height: 100vh; }
    .app-container { display: flex; height: 100%; }

    /* ── Sidebar ────────────────────────────────────────────────────── */
    .sidebar {
      width: 320px; min-width: 320px; background: var(--bg-primary); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; height: 100%;
    }
    .sidebar-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
      background: var(--bg-primary);
    }
    .sidebar-header .brand { font-size: 18px; font-weight: 900; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; flex: 1; }
    .sidebar-header .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text-secondary); font-size: 16px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .icon-btn.danger:hover { background: var(--danger); border-color: var(--danger); }

    /* Tabs */
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .sidebar-tab {
      flex: 1; padding: 12px; text-align: center; font-size: 12px; font-weight: 700;
      color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
      transition: all var(--transition); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .sidebar-tab:hover { color: var(--text-primary); }

    /* Search */
    .search-box { padding: 12px 16px; position: relative; }
    .search-box input {
      width: 100%; padding: 10px 14px 10px 36px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-primary); font-size: 13px; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box::before { content: '🔍'; position: absolute; left: 28px; top: 50%; transform: translateY(-50%); font-size: 13px; }

    /* List */
    .list-container { flex: 1; overflow-y: auto; padding: 6px 8px; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .list-item {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: var(--radius);
      cursor: pointer; transition: background var(--transition); position: relative;
    }
    .list-item:hover { background: var(--bg-hover); }
    .list-item.active { background: var(--bg-card); border: 1px solid var(--accent-glow); }
    .list-item .avatar {
      width: 42px; height: 42px; border-radius: 50%; background: var(--bg-card);
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      flex-shrink: 0; position: relative; border: 1px solid var(--border);
    }
    .list-item .status-dot {
      width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--bg-primary);
      position: absolute; bottom: 0; right: 0;
    }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--text-muted); }
    .list-item .info { flex: 1; min-width: 0; }
    .list-item .info .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .info .preview { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-item .meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
    .list-item .unread-badge {
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 10px; min-width: 18px; text-align: center;
    }
    .list-item .item-actions {
      display: none; gap: 4px; flex-shrink: 0;
    }
    .list-item:hover .item-actions { display: flex; }
    .list-item .item-actions button {
      width: 26px; height: 26px; border-radius: 50%; background: var(--bg-deep); border: 1px solid var(--border);
      color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all var(--transition);
    }
    .list-item .item-actions button:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .list-item .item-actions button.restore-btn:hover { background: var(--success); border-color: var(--success); }

    /* ── Chat Area ──────────────────────────────────────────────────── */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); }
    .chat-header {
      padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 12px; background: var(--bg-primary);
    }
    .chat-header .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid var(--border); }
    .chat-header .info .name { font-size: 15px; font-weight: 700; }
    .chat-header .info .status { font-size: 12px; color: var(--text-secondary); }
    .chat-header .actions { margin-left: auto; display: flex; gap: 8px; }

    /* Messages */
    .messages-container {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px;
    }
    .messages-container::-webkit-scrollbar { width: 5px; }
    .messages-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message-group { display: flex; gap: 8px; max-width: 70%; margin-bottom: 4px; }
    .message-group.own { align-self: flex-end; flex-direction: row-reverse; }
    .message-group .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--bg-card);
      display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0;
      align-self: flex-end; border: 1px solid var(--border);
    }
    .message-bubble {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px 12px 12px 4px;
      padding: 10px 14px; position: relative;
    }
    .message-group.own .message-bubble {
      background: var(--bg-card); border-color: var(--accent); border-radius: 12px 12px 4px 12px;
    }
    .message-bubble .sender { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .message-group.own .message-bubble .sender { color: var(--text-secondary); }
    .message-bubble .text { font-size: 14px; line-height: 1.5; word-break: break-word; }
    .message-bubble .file-attachment {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--bg-deep); border-radius: var(--radius-sm); margin-top: 6px;
      text-decoration: none; color: var(--text-primary); border: 1px solid var(--border);
    }
    .message-bubble .file-attachment:hover { border-color: var(--accent); }
    .message-bubble .file-attachment .file-icon { font-size: 22px; }
    .message-bubble .file-attachment .file-info .file-name { font-size: 13px; font-weight: 600; }
    .message-bubble .file-attachment .file-info .file-size { font-size: 11px; color: var(--text-secondary); }
    .message-bubble img.preview-img {
      max-width: 280px; max-height: 200px; border-radius: var(--radius-sm); margin-top: 6px; cursor: pointer;
    }
    .message-bubble .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; justify-content: flex-end; }
    .message-bubble .meta .time { font-size: 11px; color: var(--text-muted); }
    .message-group.own .message-bubble .meta .time { color: var(--text-secondary); }
    .message-bubble .meta .read-receipt { font-size: 12px; }
    .read-receipt.sent { color: var(--text-muted); }
    .read-receipt.delivered { color: var(--text-secondary); }
    .read-receipt.read { color: var(--accent); }
    .system-message {
      text-align: center; font-size: 12px; color: var(--text-muted); padding: 4px 16px;
      align-self: center; background: var(--bg-primary); border-radius: 20px; border: 1px solid var(--border);
    }

    /* Typing */
    .typing-indicator {
      font-size: 13px; color: var(--text-secondary); padding: 6px 24px;
      min-height: 28px; display: flex; align-items: center; gap: 8px;
    }
    .typing-dots { display: flex; gap: 3px; }
    .typing-dots span {
      width: 5px; height: 5px; background: var(--accent); border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* Input Area */
    .chat-input-area {
      padding: 14px 24px; border-top: 1px solid var(--border); background: var(--bg-primary);
      display: flex; align-items: flex-end; gap: 10px;
    }
    .chat-input-wrapper { flex: 1; }
    .chat-input {
      width: 100%; padding: 11px 16px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-primary); font-size: 14px; outline: none;
      resize: none; max-height: 120px; min-height: 42px; line-height: 1.4; font-family: inherit;
    }
    .chat-input:focus { border-color: var(--accent); }
    .chat-input::placeholder { color: var(--text-muted); }
    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; background: var(--accent); border: none;
      color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center;
      justify-content: center; transition: all var(--transition); flex-shrink: 0; font-weight: bold;
    }
    .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.3; cursor: default; transform: none; }

    /* File preview */
    .file-preview {
      display: none; padding: 8px 24px; background: var(--bg-primary); border-top: 1px solid var(--border);
      align-items: center; gap: 12px;
    }
    .file-preview.active { display: flex; }
    .file-preview .file-thumb { width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: cover; background: var(--bg-card); display: flex; align-items: center; justify-content: center; font-size: 22px; border: 1px solid var(--border); }
    .file-preview .file-details { flex: 1; }
    .file-preview .file-details .file-name { font-size: 13px; font-weight: 600; }
    .file-preview .file-details .file-size { font-size: 11px; color: var(--text-secondary); }
    .file-preview .remove-file { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; }

    /* Empty State */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text-muted); gap: 12px;
    }
    .empty-state .icon { font-size: 56px; opacity: 0.4; }
    .empty-state h3 { font-size: 18px; color: var(--text-secondary); font-weight: 700; }
    .empty-state p { font-size: 13px; }

    /* ── Bin / Recycle ──────────────────────────────────────────────── */
    .bin-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
    }
    .bin-header h3 { font-size: 15px; font-weight: 700; flex: 1; }
    .bin-header .clear-all-btn {
      padding: 6px 12px; background: var(--danger); border: none; border-radius: var(--radius-sm);
      color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .bin-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius);
      transition: background var(--transition); border-bottom: 1px solid var(--border);
    }
    .bin-item:hover { background: var(--bg-hover); }
    .bin-item .bin-icon { font-size: 28px; flex-shrink: 0; }
    .bin-item .bin-info { flex: 1; min-width: 0; }
    .bin-item .bin-info .bin-name { font-size: 13px; font-weight: 600; }
    .bin-item .bin-info .bin-preview { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bin-item .bin-info .bin-time { font-size: 10px; color: var(--text-muted); }
    .bin-item .bin-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .bin-item .bin-actions button {
      padding: 5px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      font-size: 11px; font-weight: 700; cursor: pointer; transition: all var(--transition);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .bin-item .bin-actions .restore-btn { background: transparent; color: var(--success); border-color: var(--success); }
    .bin-item .bin-actions .restore-btn:hover { background: var(--success); color: #fff; }
    .bin-item .bin-actions .delete-perm-btn { background: transparent; color: var(--danger); border-color: var(--danger); }
    .bin-item .bin-actions .delete-perm-btn:hover { background: var(--danger); color: #fff; }
    .bin-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); }
    .bin-empty .icon { font-size: 40px; margin-bottom: 8px; opacity: 0.4; }

    /* ── Modals ─────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(5,13,36,0.8); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-primary); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px var(--shadow);
    }
    .modal h3 { font-size: 16px; font-weight: 800; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); }
    .modal input, .modal select {
      width: 100%; padding: 10px 14px; background: var(--bg-deep); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; margin-bottom: 12px;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal input::placeholder { color: var(--text-muted); }
    .modal .checkbox-list { max-height: 200px; overflow-y: auto; margin-bottom: 16px; }
    .modal .checkbox-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm);
      cursor: pointer; transition: background var(--transition);
    }
    .modal .checkbox-item:hover { background: var(--bg-hover); }
    .modal .checkbox-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
    .modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; }
    .btn {
      padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-size: 13px;
      font-weight: 700; cursor: pointer; transition: all var(--transition); text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-hover); }

    /* Lightbox */
    .lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 90%; border-radius: var(--radius); }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { width: 100%; min-width: 100%; position: absolute; z-index: 10; transform: translateX(0); transition: transform 0.3s ease; }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-header .back-btn { display: flex !important; }
    }
    .back-btn { display: none; }
  </style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">🗨️</div>
    <h1>VChat</h1>
    <p>Connect and chat in real time</p>
    <div class="avatar-grid" id="avatar-grid"></div>
    <input type="text" id="username-input" placeholder="Enter your username..." maxlength="20" autocomplete="off" />
    <button id="join-btn" onclick="doJoin()">Join Chat</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">🗨️ VChat</span>
        <div class="header-actions">
          <button class="icon-btn" title="New Group" onclick="showModal('group-modal')">👥</button>
          <button class="icon-btn" title="New DM" onclick="showModal('dm-modal')">✏️</button>
          <button class="icon-btn" title="Recycle Bin" onclick="switchTab('bin')">🗑️</button>
        </div>
      </div>
      <div class="sidebar-tabs">
        <div class="sidebar-tab active" data-tab="chats" onclick="switchTab('chats')">Chats</div>
        <div class="sidebar-tab" data-tab="people" onclick="switchTab('people')">People</div>
        <div class="sidebar-tab" data-tab="bin" onclick="switchTab('bin')">🗑️ Bin</div>
      </div>
      <div class="search-box" id="search-box">
        <input type="text" id="search-input" placeholder="Search..." oninput="filterList()" />
      </div>
      <div class="list-container" id="sidebar-list"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat-area">
      <div class="empty-state" id="empty-state">
        <div class="icon">🗨️</div>
        <h3>Welcome to VChat</h3>
        <p>Select a chat or start a new conversation</p>
      </div>

      <div id="active-chat" style="display:none; flex-direction:column; height:100%;">
        <div class="chat-header">
          <button class="icon-btn back-btn" onclick="showSidebar()">←</button>
          <div class="avatar" id="chat-avatar">🗨️</div>
          <div class="info">
            <div class="name" id="chat-name">Chat</div>
            <div class="status" id="chat-status"></div>
          </div>
          <div class="actions">
            <button class="icon-btn" title="Delete chat" onclick="deleteCurrentRoom()">🗑️</button>
            <button class="icon-btn" title="Room info" onclick="showRoomInfo()">ℹ️</button>
          </div>
        </div>

        <div class="messages-container" id="messages-container"></div>

        <div class="typing-indicator" id="typing-indicator">
          <div class="typing-dots" style="display:none"><span></span><span></span><span></span></div>
          <span id="typing-text"></span>
        </div>

        <div class="file-preview" id="file-preview">
          <div class="file-thumb" id="file-thumb">📎</div>
          <div class="file-details">
            <div class="file-name" id="preview-filename"></div>
            <div class="file-size" id="preview-filesize"></div>
          </div>
          <button class="remove-file" onclick="removeFile()">✕</button>
        </div>

        <div class="chat-input-area">
          <div class="input-actions">
            <button class="icon-btn" title="Attach file" onclick="document.getElementById('file-input').click()">📎</button>
            <input type="file" id="file-input" style="display:none" accept="image/*,.pdf,.doc,.docx,.txt,.zip,.mp3,.mp4" onchange="handleFileSelect(event)" />
          </div>
          <div class="chat-input-wrapper">
            <textarea class="chat-input" id="message-input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)" oninput="handleInput()"></textarea>
          </div>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ MODALS ═══════════ -->
<div class="modal-overlay" id="group-modal">
  <div class="modal">
    <h3>👥 Create Group</h3>
    <input type="text" id="group-name-input" placeholder="Group name..." maxlength="30" />
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Select members:</p>
    <div class="checkbox-list" id="group-members-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="hideModal('group-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="createGroup()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="dm-modal">
  <div class="modal">
    <h3>✏️ New Message</h3>
    <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">Select a person:</p>
    <div class="checkbox-list" id="dm-users-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="hideModal('dm-modal')">Cancel</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" />
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────
let socket = null;
let currentUser = null;
let selectedAvatar = '😀';
let currentRoomId = null;
let rooms = [];
let onlineUsers = [];
let allUsers = [];
let typingTimers = {};
let pendingFile = null;
let activeTab = 'chats';

// ── Recycle Bin ────────────────────────────────────────────────────────
// { id, type: 'room'|'message', data, deletedAt }
let recycleBin = JSON.parse(localStorage.getItem('vchat_bin') || '[]');

function saveBin() {
  localStorage.setItem('vchat_bin', JSON.stringify(recycleBin));
}

function addToBin(type, data) {
  recycleBin.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), type, data, deletedAt: Date.now() });
  saveBin();
}

function restoreFromBin(binId) {
  const idx = recycleBin.findIndex(b => b.id === binId);
  if (idx === -1) return;
  const item = recycleBin[idx];

  if (item.type === 'room') {
    // Re-add room
    socket.emit('room:create', { name: item.data.name, members: item.data.members || [] });
  }

  recycleBin.splice(idx, 1);
  saveBin();
  renderSidebar();
}

function permanentDelete(binId) {
  recycleBin = recycleBin.filter(b => b.id !== binId);
  saveBin();
  renderSidebar();
}

function clearBin() {
  if (!confirm('Permanently delete all items in the bin?')) return;
  recycleBin = [];
  saveBin();
  renderSidebar();
}

function deleteCurrentRoom() {
  if (!currentRoomId) return;
  const room = rooms.find(r => r.id === currentRoomId);
  if (!room || room.id === 'general') return alert('Cannot delete the General room');

  if (!confirm(`Delete "${room.name}"? You can restore it from the bin.`)) return;

  addToBin('room', { id: room.id, name: room.name, type: room.type, members: room.members });
  rooms = rooms.filter(r => r.id !== currentRoomId);
  currentRoomId = null;
  document.getElementById('active-chat').style.display = 'none';
  document.getElementById('empty-state').style.display = 'flex';
  renderSidebar();
}

// ── Avatar Options ─────────────────────────────────────────────────────
const AVATARS = ['😀','😎','🧑‍💻','👩‍🎤','🦸','🦊','🐱','🐻','🌟','🔥','💎','🚀'];

function init() {
  const grid = document.getElementById('avatar-grid');
  AVATARS.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = 'avatar-option' + (i === 0 ? ' selected' : '');
    el.textContent = a;
    el.onclick = () => {
      document.querySelectorAll('.avatar-option').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedAvatar = a;
    };
    grid.appendChild(el);
  });
  document.getElementById('username-input').addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); });
}

function doJoin() {
  const username = document.getElementById('username-input').value.trim();
  const errorEl = document.getElementById('login-error');
  if (!username) { errorEl.textContent = 'Please enter a username'; errorEl.style.display = 'block'; return; }
  if (username.length < 2) { errorEl.textContent = 'At least 2 characters'; errorEl.style.display = 'block'; return; }
  errorEl.style.display = 'none';
  connectSocket(username);
}

// ── Socket ─────────────────────────────────────────────────────────────
function connectSocket(username) {
  socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', () => socket.emit('user:join', { username, avatar: selectedAvatar }));

  socket.on('user:joined', (data) => {
    currentUser = data.user;
    rooms = data.rooms;
    onlineUsers = data.onlineUsers;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    fetchAllUsers();
    renderSidebar();
    selectRoom('general');
  });

  socket.on('error', (data) => {
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = data.message;
    errorEl.style.display = 'block';
  });

  socket.on('message:new', (msg) => {
    if (msg.roomId === currentRoomId) {
      appendMessage(msg);
      scrollToBottom();
      socket.emit('messages:read', { roomId: currentRoomId });
    }
    updateRoomPreview(msg);
  });

  socket.on('room:notification', (data) => {
    if (data.roomId === currentRoomId) {
      appendSystemMessage(data.message);
      scrollToBottom();
    }
  });

  socket.on('typing:start', ({ roomId, username: typer }) => { if (roomId === currentRoomId) showTyping(typer); });
  socket.on('typing:stop', ({ roomId }) => { if (roomId === currentRoomId) hideTyping(); });
  socket.on('messages:read', () => {
    document.querySelectorAll('.read-receipt.sent, .read-receipt.delivered').forEach(el => {
      el.className = 'read-receipt read'; el.textContent = '✓✓';
    });
  });

  socket.on('users:online', (users) => { onlineUsers = users; renderSidebar(); });

  socket.on('room:created', (room) => {
    if (!rooms.find(r => r.id === room.id)) {
      rooms.push(room);
      socket.emit('room:join', { roomId: room.id });
      renderSidebar();
    }
  });

  socket.on('room:joined', ({ roomId, messages }) => {
    if (roomId === currentRoomId) renderMessages(messages);
  });
}

async function fetchAllUsers() {
  try { const res = await fetch('/api/messenger/users'); allUsers = await res.json(); } catch(e) {}
}

// ── Room Selection ─────────────────────────────────────────────────────
async function selectRoom(roomId) {
  currentRoomId = roomId;
  const room = rooms.find(r => r.id === roomId);
  if (!room) return;

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('active-chat').style.display = 'flex';
  document.getElementById('chat-name').textContent = room.name;
  document.getElementById('chat-avatar').textContent = room.type === 'dm' ? '💬' : '👥';
  document.getElementById('chat-status').textContent = room.type === 'group'
    ? `${room.members?.length || 0} members` : (isOnline(getOtherDmUser(room)) ? 'Online' : 'Offline');

  document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.list-item[data-id="${roomId}"]`)?.classList.add('active');

  socket.emit('room:join', { roomId });
  socket.emit('messages:read', { roomId });
  hideTyping();

  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
}

function getOtherDmUser(room) {
  if (room.type !== 'dm' || !currentUser) return null;
  return room.members?.find(m => m !== currentUser.id);
}
function isOnline(userId) { return onlineUsers.some(u => u.id === userId); }
function showSidebar() { document.getElementById('sidebar').classList.remove('hidden'); }

// ── Render Sidebar ─────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const search = document.getElementById('search-input').value.toLowerCase();
  const searchBox = document.getElementById('search-box');

  if (activeTab === 'bin') {
    searchBox.style.display = 'none';
    renderBinList(list);
    return;
  }

  searchBox.style.display = '';

  if (activeTab === 'chats') {
    const filtered = rooms.filter(r => r.name.toLowerCase().includes(search));
    list.innerHTML = filtered.map(room => `
      <div class="list-item ${room.id === currentRoomId ? 'active' : ''}" data-id="${room.id}" onclick="selectRoom('${room.id}')">
        <div class="avatar">${room.type === 'dm' ? '💬' : '👥'}</div>
        <div class="info">
          <div class="name">${escHtml(room.name)}</div>
          <div class="preview" id="preview-${room.id}"></div>
        </div>
        ${room.id !== 'general' ? `<div class="item-actions"><button title="Delete" onclick="event.stopPropagation();deleteRoomFromList('${room.id}')">🗑️</button></div>` : ''}
      </div>`).join('');
  } else {
    const filtered = allUsers.filter(u => u.id !== currentUser?.id && u.username.toLowerCase().includes(search));
    list.innerHTML = filtered.map(u => `
      <div class="list-item" onclick="startDM('${u.id}')">
        <div class="avatar">
          ${u.avatar || '😀'}
          <div class="status-dot ${isOnline(u.id) ? 'online' : 'offline'}"></div>
        </div>
        <div class="info">
          <div class="name">${escHtml(u.username)}</div>
          <div class="preview">${isOnline(u.id) ? 'Online' : 'Offline'}</div>
        </div>
      </div>`).join('');
  }
}

function renderBinList(container) {
  if (recycleBin.length === 0) {
    container.innerHTML = `
      <div class="bin-empty">
        <div class="icon">🗑️</div>
        <p>Bin is empty</p>
        <p style="font-size:11px;margin-top:4px;">Deleted chats and messages appear here</p>
      </div>`;
    return;
  }

  container.innerHTML = `
    <div class="bin-header">
      <h3>🗑️ Recycle Bin</h3>
      <button class="clear-all-btn" onclick="clearBin()">Clear All</button>
    </div>
  ` + recycleBin.map(item => {
    const emoji = item.type === 'room' ? (item.data.type === 'dm' ? '💬' : '👥') : '💬';
    const name = item.data.name || item.data.text || 'Deleted item';
    const preview = item.type === 'room' ? `${item.data.type || 'group'} chat` : 'Message';
    const ago = timeAgo(item.deletedAt);
    return `
      <div class="bin-item">
        <div class="bin-icon">${emoji}</div>
        <div class="bin-info">
          <div class="bin-name">${escHtml(name)}</div>
          <div class="bin-preview">${preview}</div>
          <div class="bin-time">Deleted ${ago}</div>
        </div>
        <div class="bin-actions">
          <button class="restore-btn" onclick="restoreFromBin('${item.id}')">Restore</button>
          <button class="delete-perm-btn" onclick="permanentDelete('${item.id}')">Delete</button>
        </div>
      </div>`;
  }).join('');
}

function deleteRoomFromList(roomId) {
  const room = rooms.find(r => r.id === roomId);
  if (!room || room.id === 'general') return;
  if (!confirm(`Delete "${room.name}"?`)) return;

  addToBin('room', { id: room.id, name: room.name, type: room.type, members: room.members });
  rooms = rooms.filter(r => r.id !== roomId);
  if (currentRoomId === roomId) {
    currentRoomId = null;
    document.getElementById('active-chat').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
  }
  renderSidebar();
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.sidebar-tab[data-tab="${tab}"]`).classList.add('active');
  renderSidebar();
}
function filterList() { renderSidebar(); }

// ── Render Messages ────────────────────────────────────────────────────
async function renderMessages(messages) {
  const container = document.getElementById('messages-container');
  container.innerHTML = '';
  messages.forEach(msg => appendMessage(msg));
  scrollToBottom();
}

function appendMessage(msg) {
  const container = document.getElementById('messages-container');
  const isOwn = msg.senderId === currentUser?.id;
  const sender = msg.sender || { username: 'Unknown', avatar: '😀' };

  let content = '';
  if (msg.text) content += `<div class="text">${escHtml(msg.text)}</div>`;
  if (msg.file) {
    if (msg.file.mimeType?.startsWith('image/')) {
      content += `<img class="preview-img" src="${msg.file.url}" alt="${escHtml(msg.file.name)}" onclick="openLightbox('${msg.file.url}')" />`;
    }
    content += `
      <a class="file-attachment" href="${msg.file.url}" target="_blank" rel="noopener">
        <span class="file-icon">📎</span>
        <div class="file-info">
          <div class="file-name">${escHtml(msg.file.name)}</div>
          <div class="file-size">${formatSize(msg.file.size)}</div>
        </div>
      </a>`;
  }

  const readClass = isOwn ? (msg.readBy?.length > 1 ? 'read' : 'sent') : '';
  const readIcon = isOwn ? `<span class="read-receipt ${readClass}">${readClass === 'read' ? '✓✓' : '✓'}</span>` : '';

  const div = document.createElement('div');
  div.className = `message-group ${isOwn ? 'own' : ''}`;
  div.innerHTML = `
    <div class="msg-avatar">${isOwn ? '' : (sender.avatar || '😀')}</div>
    <div class="message-bubble">
      ${!isOwn ? `<div class="sender">${escHtml(sender.username)}</div>` : ''}
      ${content}
      <div class="meta">
        <span class="time">${formatTime(msg.timestamp)}</span>
        ${readIcon}
      </div>
    </div>`;
  container.appendChild(div);
}

function appendSystemMessage(text) {
  const container = document.getElementById('messages-container');
  const div = document.createElement('div');
  div.className = 'system-message';
  div.textContent = text;
  container.appendChild(div);
}

function scrollToBottom() {
  const c = document.getElementById('messages-container');
  requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
}

// ── Send ───────────────────────────────────────────────────────────────
function sendMessage() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text && !pendingFile) return;

  const payload = { roomId: currentRoomId, text, file: null, type: 'text' };
  if (pendingFile) {
    payload.file = pendingFile;
    payload.type = pendingFile.mimeType?.startsWith('image/') ? 'image' : 'file';
    if (text) payload.type = 'text';
  }
  socket.emit('message:send', payload);
  input.value = ''; input.style.height = 'auto';
  removeFile();
  document.getElementById('send-btn').disabled = true;
}

function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }

function handleInput() {
  const input = document.getElementById('message-input');
  document.getElementById('send-btn').disabled = !input.value.trim() && !pendingFile;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  if (currentRoomId) {
    socket.emit('typing:start', { roomId: currentRoomId });
    clearTimeout(typingTimers[currentRoomId]);
    typingTimers[currentRoomId] = setTimeout(() => socket.emit('typing:stop', { roomId: currentRoomId }), 2000);
  }
}

// ── File ───────────────────────────────────────────────────────────────
async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/messenger/upload', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    pendingFile = data;
    document.getElementById('preview-filename').textContent = data.name;
    document.getElementById('preview-filesize').textContent = formatSize(data.size);
    const thumb = document.getElementById('file-thumb');
    thumb.innerHTML = data.mimeType?.startsWith('image/')
      ? `<img src="${data.url}" style="width:44px;height:44px;border-radius:6px;object-fit:cover;" />`
      : '📄';
    document.getElementById('file-preview').classList.add('active');
    document.getElementById('send-btn').disabled = false;
  } catch (err) { alert('Upload failed: ' + err.message); }
  event.target.value = '';
}

function removeFile() {
  pendingFile = null;
  document.getElementById('file-preview').classList.remove('active');
  document.getElementById('send-btn').disabled = !document.getElementById('message-input').value.trim();
}

// ── Typing ─────────────────────────────────────────────────────────────
function showTyping(username) {
  document.querySelector('.typing-dots').style.display = 'flex';
  document.getElementById('typing-text').textContent = `${username} is typing...`;
}
function hideTyping() {
  document.querySelector('.typing-dots').style.display = 'none';
  document.getElementById('typing-text').textContent = '';
}

// ── Modals ─────────────────────────────────────────────────────────────
function showModal(id) {
  document.getElementById(id).classList.add('active');
  if (id === 'group-modal') renderMemberCheckboxes();
  if (id === 'dm-modal') renderDmUserList();
}
function hideModal(id) { document.getElementById(id).classList.remove('active'); }

function renderMemberCheckboxes() {
  const list = document.getElementById('group-members-list');
  const others = allUsers.filter(u => u.id !== currentUser?.id);
  list.innerHTML = others.map(u => `
    <label class="checkbox-item">
      <input type="checkbox" value="${u.id}" />
      <span>${u.avatar || '😀'} ${escHtml(u.username)}</span>
    </label>`).join('') || '<p style="color:var(--text-muted);padding:12px;">No other users yet</p>';
}

function renderDmUserList() {
  const list = document.getElementById('dm-users-list');
  const others = allUsers.filter(u => u.id !== currentUser?.id);
  list.innerHTML = others.map(u => `
    <div class="checkbox-item" onclick="startDM('${u.id}'); hideModal('dm-modal');">
      <span>${u.avatar || '😀'} ${escHtml(u.username)}</span>
      <span style="color:var(--text-muted);font-size:11px;">${isOnline(u.id) ? '🟢 Online' : '⚪ Offline'}</span>
    </div>`).join('') || '<p style="color:var(--text-muted);padding:12px;">No other users yet</p>';
}

function createGroup() {
  const name = document.getElementById('group-name-input').value.trim();
  if (!name) return alert('Enter a group name');
  const members = [];
  document.querySelectorAll('#group-members-list input:checked').forEach(cb => members.push(cb.value));
  socket.emit('room:create', { name, members });
  hideModal('group-modal');
  document.getElementById('group-name-input').value = '';
}

function startDM(userId) {
  socket.emit('dm:start', { targetUserId: userId });
  hideModal('dm-modal');
}

function showRoomInfo() {
  const room = rooms.find(r => r.id === currentRoomId);
  if (!room) return;
  const members = (room.members || []).map(id => {
    const u = allUsers.find(u => u.id === id) || { username: 'Unknown', avatar: '😀' };
    return `${u.avatar || '😀'} ${u.username}`;
  }).join('\n');
  alert(`Room: ${room.name}\nType: ${room.type}\n\nMembers:\n${members}`);
}

// ── Lightbox ──────────────────────────────────────────────────────────
function openLightbox(url) { document.getElementById('lightbox-img').src = url; document.getElementById('lightbox').classList.add('active'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

// ── Utilities ──────────────────────────────────────────────────────────
function escHtml(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

function formatTime(ts) {
  const d = new Date(ts), now = new Date();
  if (now - d < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return Math.floor(diff / 86400000) + 'd ago';
}

function updateRoomPreview(msg) {
  const preview = document.getElementById(`preview-${msg.roomId}`);
  if (preview) {
    const sender = msg.sender?.username || 'Someone';
    preview.textContent = msg.file ? `${sender}: 📎 Attachment` : `${sender}: ${msg.text || ''}`;
  }
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('active'); });
});

init();
</script>
