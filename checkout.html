<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valmont-Pay — Redirecting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #0b1a38; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
    .card { background: #112240; border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 32px; max-width: 420px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #a0aec0; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Redirecting to secure checkout…</h1>
    <p>You are being taken to Valmont-Pay’s Paystack-powered payment page. Card details are never collected on this site.</p>
  </div>
  <script>
    // checkout.html is a redirector only. The old card/MoMo form (and its
    // simulated USSD success path) has been removed so this origin never
    // enters PCI scope.
    const params = new URLSearchParams(window.location.search);
    const access = params.get('access_code');
    if (access) {
      window.location.replace('/pay.html?access_code=' + encodeURIComponent(access));
    } else {
      document.querySelector('h1').textContent = 'Payment link unavailable';
      document.querySelector('p').textContent = 'This checkout URL is missing an access_code. Ask the merchant for a new payment link.';
    }
  </script>
</body>
</html>
