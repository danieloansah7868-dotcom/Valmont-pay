<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Valmont-Pay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;background:#f1f1f2}</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="bg-white w-full max-w-[420px] rounded-lg shadow-2xl overflow-hidden border border-gray-100 p-10 text-center">
    <div class="h-10 w-10 border-4 border-[#f68b1e] border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
    <h1 class="text-lg font-black text-[#0b1a38]">Redirecting to Secure Checkout…</h1>
    <p class="text-sm text-gray-500 font-medium mt-2">This checkout page is deprecated. You’re being sent to <span class="font-bold text-[#0b1a38]">Valmont-Pay’s secure payment page</span> (Paystack-powered).</p>
    <p class="text-xs text-gray-400 mt-4">If you are not redirected in a few seconds, <a id="fallbackLink" href="/pay.html" class="text-[#f68b1e] underline font-bold">click here</a>.</p>
  </div>
  <script>
    // Pure gateway redirect stub — no card/MoMo form, no local card handling.
    // Old integrations that link to /checkout.html?reference=&amount=&merchant= are
    // upgraded to the secure pay.html?access_code=… flow here, so pay.html remains
    // the single canonical payment page.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var reference = params.get('reference') || '';
      var merchant = params.get('merchant') || params.get('tenant') || 'valmont-electricals';
      var amount = parseFloat(params.get('amount')) || 0;
      var email = params.get('email') || '';
      var callbackUrl = params.get('callback_url') || '';
      var accessCode = params.get('access_code') || '';

      if (accessCode) {
        window.location.replace('/pay.html?access_code=' + encodeURIComponent(accessCode));
        return;
      }

      document.getElementById('fallbackLink').href = '/pay.html?reference=' + encodeURIComponent(reference) +
        '&amount=' + encodeURIComponent(amount) + '&merchant=' + encodeURIComponent(merchant) +
        '&email=' + encodeURIComponent(email) + (callbackUrl ? '&callback_url=' + encodeURIComponent(callbackUrl) : '');

      // Try to mint a secure access_code so the amount is server-locked.
      fetch('/api/v1/transaction/initialize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email || 'customer@checkout.local',
          amount: amount || 1,
          merchant: merchant,
          callback_url: callbackUrl
        })
      }).then(function (r) { return r.json(); }).then(function (json) {
        if (json && json.status && json.data && json.data.pay_url) {
          window.location.replace(json.data.pay_url);
          return;
        }
        if (json && json.status && json.data && json.data.access_code) {
          window.location.replace('/pay.html?access_code=' + encodeURIComponent(json.data.access_code));
          return;
        }
        // Fallback: carry legacy params to pay.html (pay.html will validate amount cedis & show form)
        window.location.replace('/pay.html?reference=' + encodeURIComponent(reference) +
          '&amount=' + encodeURIComponent(amount) + '&email=' + encodeURIComponent(email) +
          '&merchant=' + encodeURIComponent(merchant) + (callbackUrl ? '&callback_url=' + encodeURIComponent(callbackUrl) : ''));
      }).catch(function () {
        window.location.replace('/pay.html?reference=' + encodeURIComponent(reference) +
          '&amount=' + encodeURIComponent(amount) + '&email=' + encodeURIComponent(email) +
          '&merchant=' + encodeURIComponent(merchant) + (callbackUrl ? '&callback_url=' + encodeURIComponent(callbackUrl) : ''));
      });
    })();
  </script>
</body>
</html>
