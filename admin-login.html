<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Valmont-Pay</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1a38;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #112240;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo h1 { font-size: 28px; font-weight: 800; }
    .logo h1 span { color: #f58c14; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #a0aec0;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: #0b1a38;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }
    .form-group input:focus { border-color: #f58c14; }
    .login-button {
      width: 100%;
      padding: 16px;
      background: #f58c14;
      color: #0b1a38;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
    .login-button:hover { background: #e8b64c; }
    .error-message {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <h1>VALMONT<span>PAY</span></h1>
    </div>
    <div class="error-message" id="error-message"></div>
    <form id="login-form">
      <div class="form-group">
        <label>Email Address</label>
<input type="email" id="email" required placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="login-button">Sign In</button>
    </form>
  </div>

  <!-- The admin password is NEVER sent to the browser. Credentials are
       POSTed to /api/admin/login and verified server-side; on success the
       server sets an httpOnly, SameSite=Strict session cookie that this
       page's JavaScript cannot read. (The old /config/admin.js endpoint,
       which published ADMIN_PASSWORD to anyone, has been removed.) -->
  <script>
    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const submitButton = form.querySelector('button[type="submit"]');

    function showError(text) {
      errorMessage.textContent = text;
      errorMessage.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.style.display = 'none';
      submitButton.disabled = true;
      submitButton.textContent = 'Signing in…';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // Same-origin: the Set-Cookie response is stored by the browser.
          credentials: 'same-origin',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });

        let payload = {};
        try { payload = await res.json(); } catch (_) { /* non-JSON error page */ }

        if (res.ok && payload.status) {
          // Marks the UI as logged in. This is a convenience flag only —
          // it grants nothing; the httpOnly cookie is the real credential.
          sessionStorage.setItem('adminLoggedIn', 'true');
          window.location.href = '/dashboard.html';
          return;
        }

        if (res.status === 429) {
          showError(payload.message || 'Too many attempts. Please wait and try again.');
        } else if (res.status === 503) {
          showError(payload.message || 'Admin login is not configured yet. Contact support.');
        } else {
          showError(payload.message || 'Invalid email or password');
        }
      } catch (err) {
        showError('Could not reach the server. Check your connection and try again.');
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
