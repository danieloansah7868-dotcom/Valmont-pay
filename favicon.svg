<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Dark navy background -->
  <rect width="512" height="512" fill="#0b1a38"/>
  <!-- Outer orange hexagon -->
  <polygon points="256,32 448,144 448,368 256,480 64,368 64,144"
           fill="none" stroke="url(#orangeGrad)" stroke-width="48" stroke-linejoin="round"/>
  <!-- Inner white hexagon -->
  <polygon points="256,80 408,168 408,344 256,432 104,344 104,168"
           fill="#ffffff" stroke="#0b1a38" stroke-width="8" stroke-linejoin="round"/>
  <!-- Wallet body (dark navy) -->
  <g>
    <rect x="160" y="200" width="192" height="160" rx="12" fill="#0b1a38" stroke="#ffffff" stroke-width="4"/>
    <!-- Wallet flap -->
    <path d="M 160,200 L 160,180 Q 160,168 172,168 L 340,168 Q 352,168 352,180 L 352,200"
          fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Wallet stitching (dashed lines) -->
    <rect x="176" y="216" width="160" height="128" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Wallet clasp/tab -->
    <rect x="288" y="256" width="64" height="48" rx="8" fill="#0b1a38" stroke="#ffffff" stroke-width="4"/>
    <circle cx="320" cy="280" r="10" fill="#ffffff"/>
    <!-- Stitching on clasp -->
    <rect x="296" y="264" width="48" height="32" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  </g>
  <!-- Dollar sign circle with arrow (orange) -->
  <g>
    <!-- White circle background -->
    <circle cx="352" cy="200" r="56" fill="#ffffff" stroke="#0b1a38" stroke-width="4"/>
    <!-- Orange circular arrow -->
    <path d="M 352,156 A 44,44 0 1,1 308,200" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="308,188 308,212 290,200" fill="#f97316"/>
    <!-- Dollar sign -->
    <text x="352" y="222" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" fill="#f97316" text-anchor="middle">$</text>
  </g>
</svg>
